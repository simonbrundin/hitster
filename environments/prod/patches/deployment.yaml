apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitster-app
spec:
  template:
    spec:
      containers:
        - name: hitster-app
          # Updated by .github/workflows/commit.nuxt.yaml.
          image: >-
            ghcr.io/simonbrundin/hitster@sha256:b5b2bfbc1ffaf7953869fbc9fd6f10056e946e09576f2023751bc267a5c8c15b
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_URL
              value: "https://hitster.simonbrundin.com"
            - name: NUXT_APP_URL
              value: "https://hitster.simonbrundin.com"
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hitster-auth
                  key: SPOTIFY_CLIENT_ID
            - name: NUXT_SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hitster-auth
                  key: SPOTIFY_CLIENT_ID
            - name: NUXT_PUBLIC_SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: hitster-auth
                  key: SPOTIFY_CLIENT_ID
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hitster-auth
                  key: SPOTIFY_CLIENT_SECRET
            - name: NUXT_SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hitster-auth
                  key: SPOTIFY_CLIENT_SECRET
