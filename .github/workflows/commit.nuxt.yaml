name: CI för Nuxt applikation
on:
  push:
    branches:
      - main
    paths:
      - src/nuxt/**
      - .github/workflows/commit.nuxt.yaml
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/nuxt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  build-publish-image:
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    uses: >-
      simonbrundin/deployment-pipeline/.github/workflows/commit.build-publish-image.yaml@main
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    with:
      dockerfile: src/nuxt/Dockerfile
      dockerfile-context: src/nuxt
      registry: ghcr.io/simonbrundin/hitster
      platforms: linux/amd64,linux/arm64

  update-deployment:
    needs: build-publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: main

      - name: Install yq
        run: |
          wget -q https://github.com/mikefarah/yq/releases/download/v4.35.1/yq_linux_amd64 \
            -O /usr/local/bin/yq && chmod +x /usr/local/bin/yq

      - name: Update deployment image
        env:
          IMAGE: ${{ needs.build-publish-image.outputs.image }}
        run: |
          echo "Updating image to: $IMAGE"
          yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' \
            environments/prod/patches/deployment.yaml

      - name: Push deployment update
        env:
          IMAGE: ${{ needs.build-publish-image.outputs.image }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add environments/prod/patches/deployment.yaml
          git commit -m "chore: update hitster image [skip ci]"
          git push
